services:
  - type: web
    name: hymnal
    env: python
    buildCommand: "./venv/bin/pip install -r requirements.txt"
    startCommand: "gunicorn hymnal.wsgi:application"
    plan: free   # or starter/standard depending on your needs
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: hymnal.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hymnal-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "hymnal.onrender.com"  # replace with your actual Render app URL
      - key: DEBUG
        value: "False"

databases:
  - name: hymnal-db
    plan: free
    envVars:
      - key: POSTGRES_USER
        value: myuser
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: mydb
